<!-- fragments/profile.html -->
<div class="card">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <div style="text-align: center; margin-bottom: 30px;">
            <div
                style="width: 100px; height: 100px; background: var(--blue-soft); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 2rem; color: var(--blue-primary);">
                <i class="fa-solid fa-user"></i>
            </div>
            <h2>Configuración de Perfil</h2>
        </div>

        <form id="profileForm">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" id="profileName" value="Juan Pérez" required>
            </div>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="profileEmail" value="juan.perez@ejemplo.com" required>
            </div>
            <div class="form-group">
                <label>Empresa</label>
                <input type="text" value="Suministros Pro S.A." disabled>
            </div>
            <button type="submit" class="rol-selector" style="width: 100%; margin-top: 10px; border: none;">
                <i class="fas fa-save"></i> Guardar Cambios
            </button>
        </form>
    </div>
</div>
<script>
    if (window.profile && window.profile.init) {
        window.profile.init();
    }
</script>

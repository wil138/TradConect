<!-- fragments/analytics.html -->
<div class="analytics-dashboard">
    <div class="dashboard-header">
        <h1><i class="fas fa-chart-pie"></i> Panel de Análisis</h1>
        <div class="filters">
            <div class="filter-group">
                <label>Desde:</label>
                <input type="date" id="analyticsStartDate" />
            </div>
            <div class="filter-group">
                <label>Hasta:</label>
                <input type="date" id="analyticsEndDate" />
            </div>
            <button id="analyticsRefreshBtn" class="btn-primary"><i class="fas fa-sync-alt"></i> Actualizar</button>
        </div>
    </div>

    <!-- KPI Cards -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <span class="kpi-label">Total Ventas</span>
            <span class="kpi-value" id="kpiTotalSales">$0.00</span>
        </div>
        <div class="kpi-card">
            <span class="kpi-label">Nº Pedidos</span>
            <span class="kpi-value" id="kpiTotalOrders">0</span>
        </div>
        <div class="kpi-card">
            <span class="kpi-label">Productos Vendidos</span>
            <span class="kpi-value" id="kpiTotalItems">0</span>
        </div>
        <div class="kpi-card">
            <span class="kpi-label">Ticket Promedio</span>
            <span class="kpi-value" id="kpiAvgTicket">$0.00</span>
        </div>
    </div>

    <!-- Gráficos y tablas -->
    <div class="chart-row">
        <div class="chart-box">
            <h3>Ventas por Mes</h3>
            <canvas id="salesChart" width="400" height="250"></canvas>
        </div>
        <div class="chart-box">
            <h3>Distribución de Pedidos</h3>
            <canvas id="statusChart" width="400" height="250"></canvas>
        </div>
    </div>

    <div class="data-row">
        <div class="data-box">
            <h3>🏆 Top 5 Productos</h3>
            <div id="topProductsList"><p class="loading">Cargando...</p></div>
        </div>
        <div class="data-box">
            <h3>Ventas por Categoría</h3>
            <div id="categoryList"><p class="loading">Cargando...</p></div>
        </div>
    </div>

    <div class="data-box full-width">
        <h3>Ventas por Empresa</h3>
        <div id="companyList"><p class="loading">Cargando...</p></div>
    </div>
</div>

<script>
    // El script se ejecutará cuando el fragmento sea inyectado
    // Llamamos al módulo analytics para que se inicialice
    if (window.analytics && typeof window.analytics.init === 'function') {
        window.analytics.init();
    } else {
        console.warn('Módulo analytics no disponible');
    }
</script>

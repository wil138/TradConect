<!-- fragments/orders.html -->
<div class="card">
    <div class="container">
        <div class="inventory-header">
            <h1><i class="fas fa-truck blue"></i> Gestión de Pedidos</h1>
        </div>

        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
            <div>Monitorea y procesa las pedidos.</div>
        </p>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">Total Pedidos</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="pendingOrders">0</div>
                <div class="stat-label">Pendientes</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="sentOrders">0</div>
                <div class="stat-label">Enviados</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="deliveredOrders">0</div>
                <div class="stat-label">Entregados</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="cancelledOrders">0</div>
                <div class="stat-label">Cancelados</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalValue">$0</div>
                <div class="stat-label">Valor Total</div>
            </div>
        </div>

        <div class="search-bar">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-input" id="searchOrders"
                placeholder="Buscar por número de pedido, cliente o sucursal...">
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-filter="all">Todos</button>
            <button class="tab-btn" data-filter="Pendiente">Pendientes</button>
            <button class="tab-btn" data-filter="Confirmado">Confirmados</button>
            <button class="tab-btn" data-filter="Enviado">Enviados</button>
            <button class="tab-btn" data-filter="Entregado">Entregados</button>
            <button class="tab-btn" data-filter="Cancelado">Cancelados</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID Pedido</th>
                        <th>Fecha</th>
                        <th>Usuario</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">Cargando pedidos...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    if (window.orders && window.orders.init) window.orders.init();
</script>

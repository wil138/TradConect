<!-- fragments/orders.html -->
<div class="card orders-module">
    <div class="container">
        <div class="inventory-header">
            <h1><i class="fas fa-truck blue"></i> Gestión de Pedidos</h1>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">Total Pedidos</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="pendingOrders">0</div>
                <div class="stat-label">Pendientes</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="sentOrders">0</div>
                <div class="stat-label">Enviados</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="deliveredOrders">0</div>
                <div class="stat-label">Entregados</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="cancelledOrders">0</div>
                <div class="stat-label">Cancelados</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalValue">$0</div>
                <div class="stat-label">Valor Total</div>
            </div>
        </div>

        <div class="search-bar">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-input" id="searchOrders"
                placeholder="Buscar por número de pedido, cliente o sucursal...">
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-filter="all">Todos</button>
            <button class="tab-btn" data-filter="Pendiente">Pendientes</button>
            <button class="tab-btn" data-filter="Confirmado">Confirmados</button>
            <button class="tab-btn" data-filter="Enviado">Enviados</button>
            <button class="tab-btn" data-filter="Entregado">Entregados</button>
            <button class="tab-btn" data-filter="Cancelado">Cancelados</button>
        </div>

        <section class="report-panel" aria-labelledby="ordersReportTitle">
            <div class="report-panel-copy"><span class="report-panel-icon"><i class="fas fa-file-invoice" aria-hidden="true"></i></span><div><h2 id="ordersReportTitle">Documentos de pedidos</h2><p id="ordersExportSummary" role="status" aria-live="polite">Preparando documentos...</p></div></div>
            <div class="report-actions" role="group" aria-label="Exportar pedidos filtrados">
                <button id="ordersExportCSV" type="button" class="report-button" onclick="orders.exportReport('csv')"><i class="fas fa-file-csv" aria-hidden="true"></i> Descargar CSV</button>
                <button id="ordersExportPrint" type="button" class="report-button report-button-primary" onclick="orders.exportReport('print')"><i class="fas fa-print" aria-hidden="true"></i> Imprimir / PDF</button>
            </div>
        </section>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID Pedido</th>
                        <th>Fecha</th>
                        <th>Usuario</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">Cargando pedidos...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

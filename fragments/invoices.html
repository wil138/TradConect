<!-- fragments/invoices.html -->
<div class="card">
    <div class="invoice-container">
        <div class="card">
            <div class="invoice-header">
                <h2><i class="fas fa-file-invoice-dollar"></i> Facturación</h2>
                <button class="btn-new-invoice" id="newInvoiceBtn">
                    <i class="fas fa-plus-circle"></i> Nueva Factura
                </button>
            </div>

            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-value" id="totalFacturas">0</div>
                    <div class="stat-label">Total Facturas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalPagado">$0</div>
                    <div class="stat-label">Total Pagado</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalPendiente">$0</div>
                    <div class="stat-label">Pendiente de Pago</div>
                </div>
            </div>

            <div class="summary-cards">
                <div class="summary-card">
                    <div class="summary-label"><i class="fas fa-check-circle"></i> Pagadas</div>
                    <div class="summary-value" id="pagadasCount">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label"><i class="fas fa-clock"></i> Pendientes</div>
                    <div class="summary-value" id="pendientesCount">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label"><i class="fas fa-exclamation-triangle"></i> Vencidas</div>
                    <div class="summary-value" id="vencidasCount">0</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label"><i class="fas fa-undo-alt"></i> Reembolsadas</div>
                    <div class="summary-value" id="reembolsadasCount">0</div>
                </div>
            </div>


            <div class="tabs-container">
                <div class="tabs">
                    <button class="tab-btn active" data-filter="all"><i class="fas fa-list"></i> Todos</button>
                    <button class="tab-btn" data-filter="pagadas"><i class="fas fa-check-circle"></i> Pagadas</button>
                    <button class="tab-btn" data-filter="pendientes"><i class="fas fa-clock"></i> Pendientes</button>
                    <button class="tab-btn" data-filter="vencidas"><i class="fas fa-exclamation-triangle"></i> Vencidas</button>
                    <button class="tab-btn" data-filter="reembolsadas"><i class="fas fa-undo-alt"></i> Reembolsadas</button>
                </div>
            </div>

            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" class="search-input" id="searchInvoice"
                    placeholder="Buscar por número de factura...">
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nº Factura</th>
                            <th>Fecha</th>
                            <th>Monto</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="invoicesTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <!-- Modal Nueva Factura -->
    <div class="modal-overlay" id="invoiceModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Nueva Factura</h3><button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="invoiceForm">
                    <div class="form-group"><label>Número de Factura</label><input type="text" id="invoiceId" required>
                    </div>
                    <div class="form-group"><label>Fecha</label><input type="date" id="invoiceDate" required></div>
                    <div class="form-group"><label>Monto</label><input type="text" id="invoiceAmount" required
                            placeholder="$0.00"></div>
                    <div class="form-group"><label>Estado</label>
                        <select id="invoiceStatus">
                            <option value="pagadas">Pagada</option>
                            <option value="pendientes">Pendiente</option>
                            <option value="vencidas">Vencida</option>
                            <option value="reembolsadas">Reembolsada</option>
                        </select>
                    </div>
                    <div class="form-actions"><button type="button" class="btn-secondary"
                            id="cancelModalBtn">Cancelar</button><button type="submit" class="btn-primary">Crear
                            Factura</button></div>
                </form>
            </div>
        </div>
    </div>
    <!-- Modal Detalles -->
    <div class="modal-overlay" id="detailsModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Detalles de Factura</h3><button class="modal-close" id="closeDetailsBtn">&times;</button>
            </div>
            <div class="modal-body" id="detailsContent"></div>
        </div>
    </div>
</div>




<script>
    if (window.invoices && window.invoices.init) {
        window.invoices.init();
    }
</script>
